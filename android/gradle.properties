org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# El código de la app compila con Java 17 (AGP 9.x lo exige como mínimo).
# Si Gradle se ejecuta con un JDK más nuevo (p. ej. JDK 25) y la compilación
# falla, apunta Gradle a un JDK 17 descomentando y ajustando esta línea:
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
